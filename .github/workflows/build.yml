name: build
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install build pytest
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -m pip install 'repl-text-tools[ipython]' numpy
      - run: python -m pytest --import-mode=importlib
      - uses: actions/upload-artifact@v4
        with: {name: "wheels-${{ matrix.python-version }}", path: dist/*}
  pypi:
    name: Publish wheel and source distribution to PyPI
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-3.12
          path: dist
      - run: python -m pip install twine
      - run: python -m twine check dist/*
      - name: Upload distributions to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload --non-interactive dist/*
  conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          channels: conda-forge
          conda-build-version: "*"
      - name: Install and verify Conda upload tooling
        shell: bash -el {0}
        run: |
          conda install -y anaconda-client
          conda list --name base conda-build
          conda build --help >/dev/null
      - name: Build and upload Conda package to phygbu
        id: conda-package
        uses: uibcdf/action-build-and-upload-conda-packages@4940704d2be7906d3bda5b00e3c3e4472fd7808f
        with:
          meta_yaml_dir: conda
          user: phygbu
          label: main
          overwrite: true
          token: ${{ secrets.ANACONDA }}
      - uses: actions/upload-artifact@v4
        with:
          name: conda-package
          path: ${{ steps.conda-package.outputs.paths }}
          if-no-files-found: error
